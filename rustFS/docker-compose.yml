services:
  rustfs:
    # Versione fissata per avere sempre lo stesso risultato.
    # Per aggiornare: cambia il tag, poi `docker compose pull && docker compose up -d`.
    image: rustfs/rustfs:1.0.4
    container_name: rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web: http://localhost:9001/rustfs/console/
    environment:
      # Le credenziali vengono da .env; il compose si rifiuta di partire se mancano.
      RUSTFS_ACCESS_KEY: "admin"
      RUSTFS_SECRET_KEY: "Password123"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
    data: